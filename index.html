<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admissions Assistant</title>
    <meta
        name="description"
        content="AI-powered admissions assistant for answering questions about admissions, fees, refunds and more."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="topbar">

            <div class="brand">

                <div class="brand-logo">
                    <span>AI</span>
                </div>

                <div class="brand-info">
                    <h1>Admissions Assistant</h1>
                    <div class="status">
                        <span class="status-dot"></span>
                        Online
                    </div>
                </div>

            </div>

            <button
                class="clear-btn"
                id="clearChat"
                title="Clear conversation"
            >
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4h8v2"></path>
                    <path d="M19 6l-1 14H6L5 6"></path>
                    <path d="M10 11v5"></path>
                    <path d="M14 11v5"></path>
                </svg>

                <span>Clear</span>
            </button>

        </header>


        <!-- CHAT AREA -->
        <main class="chat-container">

            <div class="messages" id="messages">

                <!-- WELCOME MESSAGE -->
                <div class="message-row assistant-row">

                    <div class="avatar assistant-avatar">
                        AI
                    </div>

                    <div class="message-content">

                        <div class="sender">
                            Admissions Assistant
                        </div>

                        <div class="message assistant-message">
                            Hi! I'm your admissions assistant. I can help you with admissions, fees, refunds, eligibility and other questions from our knowledge base.
                        </div>

                    </div>

                </div>


                <!-- SUGGESTED QUESTIONS -->
                <div class="suggestions-wrapper">

                    <div class="suggestions-title">
                        Try asking
                    </div>

                    <div class="suggestions">

                        <button class="suggestion">
                            What are the admission fees?
                        </button>

                        <button class="suggestion">
                            When are applications open?
                        </button>

                        <button class="suggestion">
                            What is the refund policy?
                        </button>

                        <button class="suggestion">
                            Is there an age limit for admission?
                        </button>

                    </div>

                </div>

            </div>

        </main>


        <!-- INPUT AREA -->
        <footer class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Ask your question..."
                    autocomplete="off"
                ></textarea>

                <button
                    id="sendButton"
                    class="send-button"
                    aria-label="Send message"
                    title="Send message"
                >

                    <svg
                        width="21"
                        height="21"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path d="M22 2L11 13"></path>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                    </svg>

                </button>

            </div>

            <div class="input-footer">
                Powered by AI · Answers are based on the available knowledge base
            </div>

        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
